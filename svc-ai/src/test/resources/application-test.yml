spring:
  application:
    name: svc-ai-test
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 18206

aurix:
  ai:
    ollama:
      base-url: http://localhost:11434
      model: test-model
      timeout-seconds: 5

logging:
  level:
    com.aurix.platform.ai: DEBUG
