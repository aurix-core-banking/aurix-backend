spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:cambiodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS AURIX
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    enabled: false
  data:
    redis:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

aurix:
  shared:
    kafka:
      bootstrap-servers: localhost:9092
      enabled: false
    redis:
      enabled: false
  cambio:
    base-url: http://localhost:8080
  bacen:
    api:
      url-base: https://api.bcb.gov.br/dados/serie/bcdata.sgs
      timeout: 30000
    selic:
      codigo-serie: 11

server:
  port: 0

logging:
  level:
    org.hibernate.SQL: DEBUG
