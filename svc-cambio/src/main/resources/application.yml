spring:
  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    locations: classpath:db/migration
    schemas: aurix
  application:
    name: svc-cambio
  profiles:
    active: dev

server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  server:
    port: 9093

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aurix:
  bacen:
    api:
      url-base: ${AURIX_BACEN_URL:https://api.bcb.gov.br/dados/serie/bcdata.sgs}
      timeout: 30000
    selic:
      codigo-serie: 11
    jud:
      # Bloqueios judiciais padrão (formato: numeroProcesso;cpfCnpjAfetado;valor;ddMMyyyy)
      bloqueios: ""
