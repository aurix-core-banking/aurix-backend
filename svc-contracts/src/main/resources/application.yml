server:
  port: 8091

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

spring:
  application:
    name: svc-contracts
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    locations: classpath:db/migration
    schemas: aurix
  datasource:
    url: jdbc:postgresql://localhost:5432/aurix_db
    username: aurix
    password: aurix
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  health:
    db:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false

aurix:
  shared:
    kafka:
      bootstrap-servers: localhost:9092
      enabled: true
    redis:
      enabled: false
      port: 6379
  contracts:
    base-url: ${AURIX_CONTRACTS_BASE_URL:http://localhost:8080}
