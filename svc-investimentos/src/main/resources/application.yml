server:
  port: 8096

spring:
  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    locations: classpath:db/migration
    schemas: aurix
  application:
    name: svc-investimentos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    packages-to-scan: com.aurix.platform.investimentos,com.aurix.platform.shared

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aurix:
  investimentos:
    bacen:
      api:
        url-base: ${AURIX_INVESTIMENTOS_BACEN_URL:https://api.bcb.gov.br/dados/serie/bcdata.sgs}
        timeout: ${AURIX_INVESTIMENTOS_BACEN_TIMEOUT:30000}
      selic:
        intervalo-atualizacao: ${AURIX_INVESTIMENTOS_BACEN_SELIC_CRON:0 0 8 * * *}
