name: Migração de Banco de Dados (Flyway)

# Job automatizado de migração do schema compartilhado (aurix_db / schema aurex).
# As migrações aplicadas são as do classpath do svc-banking:
#   - aurix-shared/src/main/resources/db/migration  (V1, V2, V3)
#   - svc-banking/src/main/resources/db/migration   (V15, V999)
# Credenciais e URL do banco vêm dos secrets do repositório:
#   DB_URL=jdbc:postgresql://<host>:5432/aurix_db, DB_USER, DB_PASSWORD

on:
  workflow_dispatch:
    inputs:
      ambience:
        description: Ambiente-alvo (staging ou produção)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - producao
  push:
    branches: [ main ]
    paths:
      - 'aurix-shared/src/main/resources/db/migration/**'
      - 'svc-banking/src/main/resources/db/migration/**'
      - '**/src/main/resources/db/rollback/**'

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Flyway migrate (${{ inputs.ambience || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.ambience || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar nomes e checksums (Flyway validate)
        run: |
          docker run --rm \
            -v "$PWD/aurix-shared/src/main/resources/db/migration:/flyway/sql/shared:ro" \
            -v "$PWD/svc-banking/src/main/resources/db/migration:/flyway/sql/banking:ro" \
            flyway/flyway:10-alpine \
            -url="${{ secrets.DB_URL }}" \
            -user="${{ secrets.DB_USER }}" \
            -password="${{ secrets.DB_PASSWORD }}" \
            -locations="filesystem:/flyway/sql/shared,filesystem:/flyway/sql/banking" \
            -connectRetries=10 \
            -schemas=aurix \
            validate

      - name: Aplicar migrações (Flyway migrate)
        run: |
          docker run --rm \
            -v "$PWD/aurix-shared/src/main/resources/db/migration:/flyway/sql/shared:ro" \
            -v "$PWD/svc-banking/src/main/resources/db/migration:/flyway/sql/banking:ro" \
            flyway/flyway:10-alpine \
            -url="${{ secrets.DB_URL }}" \
            -user="${{ secrets.DB_USER }}" \
            -password="${{ secrets.DB_PASSWORD }}" \
            -locations="filesystem:/flyway/sql/shared,filesystem:/flyway/sql/banking" \
            -connectRetries=10 \
            -schemas=aurix \
            migrate

      - name: Verificar versões aplicadas (Flyway info)
        run: |
          docker run --rm \
            -v "$PWD/aurix-shared/src/main/resources/db/migration:/flyway/sql/shared:ro" \
            -v "$PWD/svc-banking/src/main/resources/db/migration:/flyway/sql/banking:ro" \
            flyway/flyway:10-alpine \
            -url="${{ secrets.DB_URL }}" \
            -user="${{ secrets.DB_USER }}" \
            -password="${{ secrets.DB_PASSWORD }}" \
            -locations="filesystem:/flyway/sql/shared,filesystem:/flyway/sql/banking" \
            -connectRetries=10 \
            -schemas=aurix \
            info