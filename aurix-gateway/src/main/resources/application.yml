server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aurix-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  profiles:
    active: dev

  cloud:
    gateway:
      routes:
        # ===== Consolidated Services =====

        # svc-payments (port 8081) — core, pix, payments
        - id: svc-payments
          uri: http://localhost:8081
          predicates:
            - Path=/api/core/**,/api/pix/**,/api/payments/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-credit (port 8082) — credit, consignado, financiamento
        - id: svc-credit
          uri: http://localhost:8082
          predicates:
            - Path=/api/credit/**,/api/consignado/**,/api/financiamento/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-customer (port 8083) — customers
        - id: svc-customer
          uri: http://localhost:8083
          predicates:
            - Path=/api/customer/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-products (port 8084) — products, poupanca, salario, treasury, investimento, seguros
        - id: svc-products
          uri: http://localhost:8084
          predicates:
            - Path=/api/products/**,/api/poupanca/**,/api/salario/**,/api/treasury/**,/api/investimento/**,/api/seguros/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-finance-mgmt (port 8089) — finance, accounting, settlement, pricing
        - id: svc-finance-mgmt
          uri: http://localhost:8089
          predicates:
            - Path=/api/finance/**,/api/accounting/**,/api/settlement/**,/api/pricing/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-intelligence (port 8091) — analytics, intelligence
        - id: svc-intelligence
          uri: http://localhost:8091
          predicates:
            - Path=/api/intelligence/**,/api/analytics/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-platform (port 8092) — platform, openfinance, baas, provisioning, billing, webhooks, internet-banking, mobile-banking, audit
        - id: svc-platform
          uri: http://localhost:8092
          predicates:
            - Path=/api/platform/**,/api/openfinance/**,/api/baas/**,/api/provisioning/**,/api/billing/**,/api/webhooks/**,/api/internet-banking/**,/api/mobile-banking/**,/api/audit/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-cambio (port 8093) — cambio, bacen
        - id: svc-cambio
          uri: http://localhost:8093
          predicates:
            - Path=/api/cambio/**,/api/bacen/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-banking (port 8095) — banking, onboarding, organization
        - id: svc-banking
          uri: http://localhost:8095
          predicates:
            - Path=/api/banking/**,/api/onboarding/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-fraud (port 8204) — fraud detection
        - id: svc-fraud
          uri: http://localhost:8204
          predicates:
            - Path=/api/fraud/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-compliance (port 8205) — compliance
        - id: svc-compliance
          uri: http://localhost:8205
          predicates:
            - Path=/api/compliance/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-cards (port 8094) — cards, cartoes
        - id: svc-cards
          uri: http://localhost:8094
          predicates:
            - Path=/api/cards/**,/api/cartoes/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # svc-ai (port 8206) — AI/LLM integration
        - id: svc-ai
          uri: http://localhost:8206
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name:gateway

        # ===== Health Check =====
        # Rota de health removida: o HealthController local em /health e o actuator
        # do gateway nao devem ser encaminhados para servicos de backend.

      # CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Logging
logging:
  level:
    com.aurix.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Aurix Gateway specific configuration
aurix:
  gateway:
    sandbox:
      enabled: true
    version: "1.0.0"
    description: "Aurix Gateway - API Gateway"
    api-key:
      enabled: false
      required: false
      header-name: X-API-Key
      tenant-header: X-Tenant-Id
      plan-header: X-Plan
      exempt-paths:
        - /actuator/**
        - /health/**
      keys:
        sandbox-key-aurix-demo:
          plan: sandbox
          tenantId: default
      plan-limits:
        free: 10
        sandbox: 30
        starter: 60
        growth: 300
        enterprise: 1000
    rate-limit:
      enabled: true
      redis-enabled: false
      requests-per-minute: 100
      burst-capacity: 200

  security:
    jwt:
      enabled: false
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      jwk-set-uri: ${KEYCLOAK_JWKS_URI:}
      secret: ${AURIX_JWT_SECRET:}
      expiration: 86400000

# Resilience4j (circuit breaker)
resilience4j:
  circuitbreaker:
    instances:
      gateway:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.aurix.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

aurix:
  gateway:
    api-key:
      enabled: true
      required: true
    rate-limit:
      redis-enabled: true
  security:
    jwt:
      enabled: true

logging:
  level:
    com.aurix.platform: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.web: WARN
