server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aurix-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  profiles:
    active: dev

  cloud:
    gateway:
      routes:
        # ===== Serviços consolidados =====
        # Os controllers expõem /api/<dominio>/... e o path original é encaminhado
        # integralmente ao serviço (sem StripPrefix). O gateway real de produção é o
        # Traefik (aurix-infrastructure/traefik/dynamic.yml); este SCG serve de
        # alternativa standalone para desenvolvimento.

        # svc-banking (8200) — núcleo, contas, poupança, salário, transações
        - id: svc-banking
          uri: http://localhost:8200
          predicates:
            - Path=/api/banking/**,/api/core/**,/api/poupanca/**,/api/salario/**,/api/transacoes/**,/api/controle-saldos/**,/api/gestao-risco/**,/api/liquidacao/**,/api/motor-tarifas/**,/api/remuneracao/**,/api/settlement/**,/api/pricing/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-payments (8201) — PIX
        - id: svc-payments
          uri: http://localhost:8201
          predicates:
            - Path=/api/payments/**,/api/pix/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-credit (8082) — crédito, consignado, financiamento
        - id: svc-credit
          uri: http://localhost:8082
          predicates:
            - Path=/api/credit/**,/api/consignado/**,/api/financiamento/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-customer (8083) — clientes, auth, onboarding (controllers fora de /api/customer)
        - id: svc-customer
          uri: http://localhost:8083
          predicates:
            - Path=/api/clientes/**,/api/onboarding/**,/api/mfa/**,/api/security/**,/auth/**,/contas/pf/**,/contas/pj/**,/solicitacoes/**
          filters:
            - RewritePath=/api/clientes(?<segment>/?.*),/clientes${segment}
            - RewritePath=/api/onboarding(?<segment>/?.*),${segment}
            - CircuitBreaker=name:gateway

        # svc-products (8084) — catálogo de produtos
        - id: svc-products
          uri: http://localhost:8084
          predicates:
            - Path=/api/products/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-contracts (8085) — contratos
        - id: svc-contracts
          uri: http://localhost:8085
          predicates:
            - Path=/api/contracts/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-finance-mgmt (8089) — contabilidade, orçamento, impostos
        - id: svc-finance-mgmt
          uri: http://localhost:8089
          predicates:
            - Path=/api/finance/**,/api/accounting/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-intelligence (8091) — analytics, BI
        - id: svc-intelligence
          uri: http://localhost:8091
          predicates:
            - Path=/api/intelligence/**,/api/analytics/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-platform (8092) — open finance, webhooks, notificações, audit
        - id: svc-platform
          uri: http://localhost:8092
          predicates:
            - Path=/api/platform/**,/api/openfinance/**,/api/baas/**,/api/provisioning/**,/api/billing/**,/api/webhooks/**,/api/audit/**,/api/notificacoes/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-cambio (8093) — câmbio, BACEN
        - id: svc-cambio
          uri: http://localhost:8093
          predicates:
            - Path=/api/cambio/**,/api/bacen/**,/api/cotacoes/**,/api/remessas/**,/api/selic/**,/api/spi-str/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-fraud (8207) — detecção de fraude
        - id: svc-fraud
          uri: http://localhost:8207
          predicates:
            - Path=/api/fraud/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-compliance (8205) — compliance, regulação
        - id: svc-compliance
          uri: http://localhost:8205
          predicates:
            - Path=/api/compliance/**
          filters:
            - CircuitBreaker=name:gateway

        # svc-cards (8094) — cartões
        - id: svc-cards
          uri: http://localhost:8094
          predicates:
            - Path=/api/cards/**,/api/cartoes/**
          filters:
            - RewritePath=/api/cartoes(?<segment>/?.*),/api/cards${segment}
            - CircuitBreaker=name:gateway

        # svc-ai (8206) — IA/LLM
        - id: svc-ai
          uri: http://localhost:8206
          predicates:
            - Path=/api/ai/**
          filters:
            - CircuitBreaker=name:gateway

        # ===== Health Check =====
        # Rota de health removida: o HealthController local em /health e o actuator
        # do gateway nao devem ser encaminhados para servicos de backend.

      # CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Logging
logging:
  level:
    com.aurix.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Aurix Gateway specific configuration
aurix:
  gateway:
    sandbox:
      enabled: true
    version: "1.0.0"
    description: "Aurix Gateway - API Gateway"
    api-key:
      enabled: false
      required: false
      header-name: X-API-Key
      tenant-header: X-Tenant-Id
      plan-header: X-Plan
      exempt-paths:
        - /actuator/**
        - /health/**
      keys:
        sandbox-key-aurix-demo:
          plan: sandbox
          tenantId: default
      plan-limits:
        free: 10
        sandbox: 30
        starter: 60
        growth: 300
        enterprise: 1000
    rate-limit:
      enabled: true
      redis-enabled: false
      requests-per-minute: 100
      burst-capacity: 200

  security:
    jwt:
      enabled: false
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      jwk-set-uri: ${KEYCLOAK_JWKS_URI:}
      secret: ${AURIX_JWT_SECRET:}
      expiration: 86400000

# Resilience4j (circuit breaker)
resilience4j:
  circuitbreaker:
    instances:
      gateway:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.aurix.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

aurix:
  gateway:
    api-key:
      enabled: true
      required: true
    rate-limit:
      redis-enabled: true
  security:
    jwt:
      enabled: true

logging:
  level:
    com.aurix.platform: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.web: WARN
