spring:
  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    locations: classpath:db/migration
    schemas: aurix
  application:
    name: svc-platform
  profiles:
    active: dev

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  server:
    port: 9092
  health:
    db:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aurix:
  provisioning:
    # stub (default) ou real. Em "real", cria o banco por tenant no MULTI_TENANT.
    provider: stub
    admin-jdbc-url: ${AURIX_PROVISIONING_ADMIN_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    admin-username: ${AURIX_PROVISIONING_ADMIN_USERNAME:postgres}
    admin-password: ${AURIX_PROVISIONING_ADMIN_PASSWORD:}
