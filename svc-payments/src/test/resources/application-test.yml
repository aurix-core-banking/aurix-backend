spring:
  datasource:
    url: jdbc:h2:mem:aurix_pix_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS aurix
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: aurix
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
      fail-fast: false
  security:
    enabled: false

aurix:
  pix:
    bacen:
      spi-url: http://localhost:8094
